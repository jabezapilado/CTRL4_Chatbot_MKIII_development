<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token }}" />
    <title>Case Status — SOC Guidance Office</title>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/case_status.css" />
  </head>
  <body>
    <main class="case-status-page">
      <header class="case-status-header">
        <div class="case-status-brand">
          <img src="/static/img/soc-logo.png" alt="SOC logo" />
          <div>
            <div class="case-status-office">SOC Guidance Office</div>
            <div class="case-status-school">School of Computing</div>
          </div>
        </div>
        <a class="btn btn-outline" href="/chatbot">Back to Chat</a>
      </header>

      <section class="case-status-content" aria-labelledby="case-status-title">
        <p class="case-status-eyebrow">Guidance Case</p>
        <h1 id="case-status-title">Case Status</h1>
        <p class="case-status-description">
          View the current status of your submitted guidance cases.
        </p>
        <div id="student-case-status-message" role="status"></div>
        <div
          id="student-case-status-list"
          class="student-case-status-list"
        ></div>
      </section>
    </main>

    <script src="/static/js/security.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/case_status.js"></script>
  </body>
</html>
