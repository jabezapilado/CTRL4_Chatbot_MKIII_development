<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Administrator account-management interface for CTRL4 Chatbot MK III."
    />
    <title>Account Management — CTRL4 Chatbot MK III</title>
    <link rel="stylesheet" href="/static/css/base.css" />
  </head>
  <body>
    <main class="page" style="max-width: 1100px; margin: 0 auto; padding: 32px 20px">
      <header class="header" style="margin-bottom: 24px">
        <div class="header-inner">
          <div class="header-text">
            <div class="header-title">Account Management</div>
            <div class="header-sub">Administrator-only account listing</div>
          </div>
          <button class="btn btn-outline" type="button" id="admin-logout-btn">
            Logout
          </button>
        </div>
      </header>

      <section class="card" aria-labelledby="account-list-title">
        <h1 id="account-list-title">Accounts</h1>
        <p>
          This page is limited to the account-management functions available to
          administrators. Guidance Office records and operations are not shown.
        </p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin: 20px 0">
          <label>
            Search accounts
            <input id="account-search" type="search" autocomplete="off" />
          </label>
          <label>
            Role
            <select id="account-role-filter">
              <option value="">All roles</option>
              <option value="student">Student</option>
              <option value="staff">Guidance staff</option>
              <option value="admin">Administrator</option>
            </select>
          </label>
          <label>
            Status
            <select id="account-status-filter">
              <option value="">All statuses</option>
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </label>
          <button class="btn btn-primary" type="button" id="account-search-btn">
            Apply
          </button>
        </div>
        <p id="account-list-message" role="status"></p>
        <div style="overflow-x: auto">
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Status</th>
                <th>Account number</th>
              </tr>
            </thead>
            <tbody id="account-list-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/admin.js"></script>
  </body>
</html>
